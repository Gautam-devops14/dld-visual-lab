<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Map Visualizer | DLD Lab</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>DLD Visual Lab: Karnaugh Map</h1>
        <p>Interactive K-Map solver with Truth Table, SOP, and POS</p>
    </header>

    <main class="container">
        <div class="grid-layout">
            <section class="card truth-table-section">
                <h2>Truth Table (4 Variables)</h2>
                <div class="table-container">
                    <table id="truthTable">
                        <thead>
                            <tr>
                                <th>A</th>
                                <th>B</th>
                                <th>C</th>
                                <th>D</th>
                                <th>Output (Y)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Rows generated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <div class="right-column">
                <section class="card kmap-section">
                    <h2>Karnaugh Map</h2>
                    <div class="kmap-container">
                        <table id="kmapTable" class="kmap">
                            <!-- K-Map generated by JS -->
                        </table>
                    </div>
                </section>

                <section class="card results-section">
                    <h2>Results</h2>
                    <div class="result-box">
                        <h3>Sum of Products (SOP)</h3>
                        <p id="sopResult" class="equation">Click cells to evaluate</p>
                    </div>
                    <div class="result-box">
                        <h3>Product of Sums (POS)</h3>
                        <p id="posResult" class="equation">Click cells to evaluate</p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
